<!doctype html><meta charset="utf-8">

<style>
  @font-face{font-family:'Newsreader';src:url('http://127.0.0.1:4399/fonts/newsreader-normal-latin.woff2') format('woff2-variations');font-weight:200 800;}
  @font-face{font-family:'Libre Franklin';src:url('http://127.0.0.1:4399/fonts/libre-franklin-normal-latin.woff2') format('woff2-variations');font-weight:100 900;}
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:#050D16;
       font-family:'Libre Franklin',sans-serif;color:#F2EDE3;-webkit-font-smoothing:antialiased}
  .bg{position:absolute;inset:0}
  .bg img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;
          filter:saturate(.55) brightness(.62) contrast(1.05)}
  .scrim{position:absolute;inset:0;background:
      linear-gradient(100deg,rgba(5,13,22,.94) 0%,rgba(5,13,22,.78) 42%,rgba(5,13,22,.42) 100%),
      linear-gradient(0deg,rgba(5,13,22,.85) 0%,rgba(5,13,22,0) 55%)}
  .in{position:relative;height:100%;padding:60px 72px 56px;display:flex;flex-direction:column;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:13px;font-size:15px;font-weight:600;letter-spacing:.155em;text-transform:uppercase}
  .mark .dim{color:rgba(242,237,227,.55)}
  .star{width:19px;height:19px;color:#C4A469}
  h1{font-family:'Newsreader',serif;font-weight:320;font-size:60px;line-height:1.06;
     letter-spacing:-.022em;max-width:17ch}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .rule{position:absolute;left:72px;right:72px;bottom:142px;height:1px;background:rgba(242,237,227,.18)}
  .pilots{display:flex;gap:40px;font-size:15px;color:rgba(242,237,227,.72)}
  .pilots b{color:#C4A469;font-weight:600;font-variant-numeric:tabular-nums;margin-right:8px}
  .url{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,237,227,.5)}
</style>
<div class="bg"><img src="http://127.0.0.1:4399/media/hero.jpg"></div>
<div class="scrim"></div>
<div class="in">
  <div class="mark">
    <svg class="star" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1"/><path d="M12 5.6 13.9 10h4.6l-3.7 2.8 1.4 4.5L12 14.5l-4.2 2.8 1.4-4.5L5.5 10h4.6L12 5.6Z" fill="currentColor" opacity=".85"/></svg>
    <span>Lion Forum <span class="dim">Institute</span></span>
